<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 作品占位页</title>
    <style>
      body {
        margin: 0;
        font-family: "Helvetica Neue", "PingFang SC", sans-serif;
        background: linear-gradient(180deg, #f8f2e8, #f3eadc);
        color: #2f2725;
      }

      main {
        width: min(1040px, calc(100vw - 80px));
        margin: 0 auto;
        padding: 72px 0 120px;
      }

      section {
        margin-bottom: 28px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 34px rgba(94, 73, 48, 0.08);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 48px;
      }

      p {
        line-height: 1.8;
        font-size: 18px;
      }

      .hero {
        padding: 56px 40px;
        background: linear-gradient(135deg, #f19cd3, #b8cff8);
        color: #2f2725;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>HTML 作品占位页</h1>
        <p>后续把你已经做好的完整 HTML 单页放进 public/project-html 目录，再把配置里的路径替换过来即可。</p>
      </section>
      <section>
        <p>这个页面现在只是为了保证整站骨架先跑通，包括整页沉浸式展示、iframe 承载完整单页内容，以及返回原 tab 的交互。</p>
      </section>
    </main>
  </body>
  </html>
