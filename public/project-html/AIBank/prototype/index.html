<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>资金地图 - 原型</title>
<style>
@font-face {
  font-family: "AlibabaSansNumber";
  src: url("../AlibabaSans102Ver2-Bd.otf") format("opentype");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
  unicode-range: U+0030-0039;
}

/* ===== DESIGN TOKENS ===== */
:root {
  --primary: #1677FF;
  --primary-light: #E6F2FF;
  --primary-pale: #F5F9FF;
  --bg: #F5F6FA;
  --surface: #FFFFFF;
  --text-primary: #1A1A1A;
  --text-secondary: #6B7280;
  --text-tertiary: #9CA3AF;
  --text-inverse: #FFFFFF;
  --border: #EBEDF0;
  --border-light: #F3F4F6;
  --success: #22C55E;
  --success-bg: #F0FDF4;
  --warning: #F59E0B;
  --warning-bg: #FFF7ED;
  --danger: #EF4444;
  --danger-bg: #FEF2F2;
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 12px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --font-xs: 11px;
  --font-sm: 12px;
  --font-base: 14px;
  --font-lg: 15px;
  --font-xl: 16px;
  --font-2xl: 18px;
  --font-3xl: 20px;
  --font-4xl: 24px;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --line-height: 1.5;
  --transition: 150ms ease;
}

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scrollbar-width: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}

body {
  font-family: "AlibabaSansNumber", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: var(--font-base);
  font-weight: var(--weight-normal);
  line-height: var(--line-height);
  color: var(--text-primary);
  background: #FFFFFF;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-width: 1086px;
  padding: 0;
  overflow: auto;
}

/* ===== PHONE FRAME ===== */
.phone-frame {
  width: 375px;
  height: 100%;
  background: #F0F6FF;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  border-radius: 0;
  scrollbar-width: none;
}
.phone-frame::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 100%;
  background: url('../background.png') no-repeat center top;
  background-size: cover;
  pointer-events: none;
}
.phone-frame::-webkit-scrollbar { display: none; }

/* ===== TOP NAVBAR ===== */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 0 var(--space-lg);
}

.navbar-status {
  height: 44px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: var(--space-sm);
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
  color: var(--text-primary);
}

.navbar-main {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-back {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-primary);
  border-radius: var(--radius-sm);
}
.nav-back:active { background: var(--border-light); }

.nav-title-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.nav-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.green { background: var(--success); }
.status-dot.blue  { background: var(--primary); }
.status-dot.orange { background: var(--warning); }

.nav-title {
  font-size: var(--font-xl);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

.nav-updated {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-top: 1px;
  cursor: pointer;
}

.nav-more {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-primary);
  border-radius: var(--radius-sm);
}
.nav-more:active { background: var(--border-light); }

/* ===== PAGE CONTENT ===== */
.content {
  position: relative;
  z-index: 1;
  padding: 64px var(--space-lg) 96px;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  min-height: 100%;
}

/* story-nav sits sticky under the navbar; let it own its slot */
.story-nav {
  margin: 0 0 var(--space-md);
}

.bottom-bar {
  position: sticky;
  bottom: 0;
  width: 100%;
  height: auto;
  z-index: 150;
  display: block;
  pointer-events: none;
  background: var(--surface);
}

/* ===== CARDS ===== */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--space-lg);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.card-title {
  font-size: var(--font-lg);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

.card-subtitle {
  font-size: var(--font-sm);
  color: var(--text-tertiary);
  margin-top: 2px;
}

/* ===== WEEK SUMMARY ===== */
.week-summary {
  position: relative;
  background: radial-gradient(circle at 50% 42%, #E9F1FF 0%, #FFFFFF 54%, #FFFFFF 100%);
  border: 1px solid transparent;
  background-clip: padding-box;
}

.week-summary::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, #74D5FF 0%, #75ABFF 35%, #63A4FF 68%, #BBABFF 100%);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.week-summary-visual {
  display: block;
  width: 88px;
  height: auto;
  margin: 0 0 12px 0;
}

.role-switch {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 42px;
  padding: 0;
  background: transparent;
  border-radius: 0;
  border: none;
  margin: 0;
  max-width: none;
}

.role-option {
  border: none;
  background: transparent;
  border-radius: 0;
  padding: 0 0 6px;
  font-family: inherit;
  font-size: var(--font-base);
  color: #666666;
  cursor: pointer;
  position: relative;
}

.role-option.active {
  background: transparent;
  color: var(--primary);
  font-weight: var(--weight-semibold);
}

.role-option.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  border-radius: 999px;
  background: var(--primary);
}

.role-switch-label {
  margin-top: 20px;
  font-size: 12px;
  color: #999999;
}

.stage-phone .role-switch {
  position: absolute;
  left: 19px;
  top: 956px;
  width: 375px;
  max-width: 375px;
  margin: 0;
  z-index: 540;
}

.week-summary-text {
  min-height: calc(var(--font-sm) * 1.65 * 3);
  font-size: var(--font-sm);
  font-weight: var(--weight-normal);
  color: #333333;
  line-height: 1.65;
}

.week-summary-cursor {
  display: inline-block;
  width: 1px;
  height: 1em;
  margin-left: 2px;
  background: #333333;
  vertical-align: -0.12em;
  animation: summaryCursorBlink 900ms steps(1) infinite;
}

@keyframes summaryCursorBlink {
  0%, 45% { opacity: 1; }
  46%, 100% { opacity: 0; }
}

/* ===== BRIEFING CARD ===== */
.briefing-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 0.5px solid var(--border);
  border-left: 3px solid var(--primary);
  padding: var(--space-md) var(--space-lg);
  cursor: pointer;
  transition: opacity var(--transition);
}
.briefing-card:active { opacity: 0.7; }
.briefing-card.alert { border-left-color: var(--warning); }

.briefing-main {
  font-size: var(--font-lg);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  margin-bottom: var(--space-xs);
}

.briefing-sub {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  line-height: 1.5;
}

.briefing-arrow {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  font-size: var(--font-sm);
  color: var(--primary);
  margin-top: var(--space-sm);
  font-weight: var(--weight-medium);
}

.briefing-icon {
  display: inline-block;
  width: 16px;
  height: 16px;
  background: var(--primary-light);
  border-radius: 4px;
  margin-right: 6px;
  vertical-align: middle;
}

/* ===== MAP CARD ===== */
.map-tabs {
  position: relative;
  display: flex;
  margin: calc(-1 * var(--space-lg)) calc(-1 * var(--space-lg)) 16px;
  background: url('../tab.png') no-repeat center center;
  background-size: 100% 100%;
  border-radius: var(--radius) var(--radius) 0 0;
  overflow: hidden;
}
.map-tabs::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 50%;
  background: url('../lefttab.png') no-repeat center center;
  background-size: 100% 100%;
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
  z-index: 0;
}
.map-tabs.show-left::before { opacity: 1; }
.map-tabs::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 50%;
  background: url('../righttab.png') no-repeat center center;
  background-size: 100% 100%;
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
  z-index: 0;
}
.map-tabs.show-right::after { opacity: 1; }

.map-tab {
  position: relative;
  z-index: 1;
  flex: 1;
  text-align: center;
  font-size: 14px;
  font-weight: var(--weight-normal);
  color: #999999;
  cursor: pointer;
  transition: color var(--transition);
  padding: 10px 0;
}
.map-tab span {
  position: relative;
  display: inline-block;
}
.map-tab.active span::after {
  content: "";
  display: block;
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(to right, #B1D1FF, #FFFFFF);
  margin-top: 0;
}
.map-tab.active {
  color: #333333;
  font-weight: var(--weight-semibold);
}

.map-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: var(--font-xs);
  font-weight: var(--weight-medium);
}
.map-tag.green  { background: var(--success-bg); color: var(--success); }
.map-tag.blue   { background: var(--primary-light); color: var(--primary); }
.map-tag.orange { background: var(--warning-bg); color: #D97706; }
.map-tag.red    { background: var(--danger-bg); color: var(--danger); }

/* View toggling */
.flow-view { display: block; }
.balance-view { display: none; }

/* ===== FUND FLOW (资金流向·三列+连接线) ===== */
.flow-grid {
  display: grid;
  grid-template-columns: 1fr 22px 74px 22px 1fr;
  align-items: stretch;
  gap: 0;
}

.flow-col-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: var(--font-xs);
  color: #333333;
  font-weight: var(--weight-medium);
  margin-bottom: 5px;
}
.flow-col-title .arrow-up { color: var(--text-tertiary); }
.flow-col-title .arrow-dn { color: var(--text-tertiary); }

.flow-col-total {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  text-align: center;
  margin-bottom: 5px;
  white-space: nowrap;
}

.flow-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.flow-side {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-height: 0;
}

/* 每个项目：标题在上，数字在下 */
.flow-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  flex: 1;
  justify-content: center;
  background: var(--border-light);
}
.flow-card .fc-name {
  font-size: 9px;
  color: #333333;
  white-space: nowrap;
}
.flow-card .fc-amt {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: var(--font-sm);
  font-weight: var(--weight-normal);
  color: #666666;
  white-space: nowrap;
}

/* 连接线列 */
.flow-link {
  align-self: stretch;
  position: relative;
  display: flex;
  flex-direction: column;
}
.flow-link svg {
  flex: 1;
  width: 100%;
  min-height: 0;
}

/* 中间金额列 */
.flow-pool-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flow-pool-box {
  width: 100%;
  flex: 1;
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary-pale) 100%);
  border: 1px solid var(--primary-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 8px 4px;
  min-height: 0;
}
.flow-pool-label {
  font-size: var(--font-xs);
  color: #333333;
  font-weight: var(--weight-medium);
}
.flow-pool-amt {
  display: block;
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
  color: var(--primary);
  line-height: 1.2;
  white-space: nowrap;
}
.flow-pool-sub {
  font-size: 9px;
  color: var(--text-tertiary);
  text-align: center;
  line-height: 1.3;
}
.flow-pool-net {
  font-size: 9px;
  font-weight: var(--weight-semibold);
  color: var(--danger);
  margin-top: 4px;
  text-align: center;
}

/* ===== BALANCE CURVE (本周余额曲线) ===== */
.balance-curve {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--space-lg);
}
.balance-curve-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}
.balance-curve-title {
  font-size: var(--font-lg);
  font-weight: var(--weight-semibold);
}
.balance-curve-sub {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-top: 2px;
}
.balance-curve-svg {
  width: 100%;
  height: 130px;
  display: block;
  overflow: visible;
}
.bc-axis-label {
  font-size: 9px;
  fill: var(--text-tertiary);
}
.bc-safety {
  stroke: var(--warning);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}
.bc-safety-label {
  font-size: 9px;
  fill: var(--warning);
  font-weight: var(--weight-medium);
}
.bc-area {
  fill: var(--primary-light);
  opacity: 0.6;
}
.bc-line {
  fill: none;
  stroke: var(--primary);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.bc-point {
  fill: var(--surface);
  stroke: var(--primary);
  stroke-width: 2;
}
.bc-point.danger {
  fill: var(--primary);
  stroke: var(--primary);
}
.bc-point-label {
  font-size: 9px;
  fill: var(--text-secondary);
  font-weight: var(--weight-medium);
  text-anchor: middle;
}
.bc-point-label.danger {
  fill: var(--danger);
  font-weight: var(--weight-semibold);
}
.bc-day-label {
  font-size: 10px;
  fill: var(--text-tertiary);
  text-anchor: middle;
}
.bc-legend {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-lg);
  font-size: 9px;
  color: var(--text-secondary);
  margin-top: var(--space-sm);
}
.bc-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.bc-legend-line {
  width: 14px;
  height: 2px;
  border-radius: 1px;
}
.bc-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
/* Flow buttons */
.flow-actions {
  display: flex;
  gap: var(--space-sm);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: var(--font-base);
  font-weight: var(--weight-medium);
  border: 0.5px solid var(--border);
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  white-space: nowrap;
}

.btn-primary {
  flex: 1;
  background: var(--primary);
  color: var(--text-inverse);
  border-color: var(--primary);
}
.btn-primary:active { opacity: 0.8; }

.btn-secondary {
  flex: 1;
  background: var(--surface);
  color: #1677FF;
  border-color: #1677FF;
}
.btn-secondary:active { background: var(--border-light); }

.btn-sm {
  padding: 6px 12px;
  font-size: var(--font-sm);
}

/* ===== CASH MGMT CARD ===== */
.cash-timeline {
  display: flex;
  align-items: center;
  margin-bottom: var(--space-lg);
  position: relative;
}

.cash-timeline-bar {
  position: absolute;
  top: 12px;
  left: 24px;
  right: 24px;
  height: 4px;
  background: var(--border-light);
  border-radius: 2px;
}

.cash-timeline-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 2px;
  transition: width 400ms ease;
}

.cash-nodes {
  display: flex;
  justify-content: space-between;
  width: 100%;
  position: relative;
  z-index: 1;
}

.cash-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
  text-align: center;
}

.cash-node-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  transition: all var(--transition);
}
.cash-node-dot.done { background: var(--primary); border-color: var(--primary); }
.cash-node-dot.active { border-color: var(--primary); border-width: 2.5px; }

.cash-node-date {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  font-weight: var(--weight-medium);
}
.cash-node-label {
  font-size: 10px;
  color: var(--text-tertiary);
}

.cash-compare {
  margin-bottom: var(--space-md);
}

.cash-compare-title {
  text-align: center;
  font-size: var(--font-lg);
  font-weight: var(--weight-normal);
  color: var(--text-primary);
  margin-bottom: var(--space-md);
}
.cash-compare-title strong {
  font-weight: var(--weight-semibold);
  color: var(--warning);
}

.cash-compare-bars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 4px 0;
}

.cash-bar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-width: 120px;
}

.cash-bar {
  width: 100%;
  height: 56px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  background: #F5F5F5;
}

.cash-bar.upgrade {
  background: #FFA940;
  color: white;
}

.cash-bar-arrow {
  width: 24px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cash-bar-arrow svg {
  width: 20px;
  height: 20px;
  fill: var(--warning);
}

.cash-bar-label {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  text-align: center;
  line-height: 1.35;
}

.cash-product {
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
}

.cash-product-name {
  font-size: var(--font-base);
  font-weight: var(--weight-semibold);
  margin-bottom: var(--space-xs);
}

.cash-product-details {
  display: flex;
  gap: var(--space-lg);
  font-size: var(--font-sm);
  color: var(--text-secondary);
}

/* ===== ACTION CARDS ===== */
.action-section-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.action-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}

.week-overview-link {
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 11px;
  font-weight: var(--weight-normal);
  color: #999999;
  cursor: pointer;
  padding: 4px 0 4px 8px;
}

.week-overview-link:active {
  color: var(--primary);
}

.action-card {
  background: var(--primary-pale);
  border-radius: var(--radius);
  padding: var(--space-lg);
}

.action-card.done {
  opacity: 0.5;
}

.action-card-header {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-sm);
}

.action-title {
  font-size: var(--font-base);
  font-weight: var(--weight-semibold);
}

.action-desc {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
  line-height: 1.5;
}

.cash-product-img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  margin: 0 0 var(--space-md);
}

/* Collection details */
.collection-details {
  background: var(--surface);
  border: 0.5px solid var(--border-light);
  border-radius: var(--radius-sm);
  margin-bottom: var(--space-md);
  overflow: hidden;
}

.collection-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  padding: 10px 0;
  margin: 0 var(--space-md);
  border-bottom: 0.5px solid var(--border-light);
  font-size: var(--font-sm);
}

.collection-row:last-of-type { border-bottom: none; }
.collection-row.hidden { display: none; }
.collection-details.expanded .collection-row.hidden { display: flex; }

.collection-shop {
  color: #333333;
}

.collection-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 2px;
}

.collection-habit {
  font-size: 10px;
  color: #999999;
}

.collection-habit .late {
  color: var(--danger);
}

.collection-amount {
  color: #666666;
  font-weight: var(--weight-normal);
  white-space: nowrap;
}

.task-facts {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 10px var(--space-md);
  min-width: 0;
}

.task-fact {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.task-fact-label {
  display: block;
  font-size: 10px;
  color: var(--text-tertiary);
  margin-bottom: 2px;
}

.task-fact-value {
  display: block;
  font-size: var(--font-xs);
  color: var(--text-primary);
  font-weight: var(--weight-semibold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.collection-toggle {
  width: 100%;
  border: none;
  border-top: 0.5px solid var(--border-light);
  background: var(--surface);
  color: #999999;
  font-size: var(--font-xs);
  font-family: inherit;
  padding: 8px 0;
  cursor: pointer;
}

.collection-arrow {
  display: inline-block;
  margin-left: 4px;
  transition: transform var(--transition);
}

.collection-details.expanded .collection-arrow {
  transform: rotate(180deg);
}

/* Compare numbers */
.compare-row {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
  font-size: var(--font-sm);
}

.compare-label { color: var(--text-secondary); }
.compare-val  { font-weight: var(--weight-semibold); }
.compare-arrow { color: var(--success); font-weight: var(--weight-semibold); }

.action-buttons {
  display: flex;
  gap: var(--space-sm);
}

.action-buttons .btn-primary { flex: 1; }
.action-buttons .btn-secondary { flex: 1; }

/* Account flow mini */
.account-flow {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: center;
  column-gap: 6px;
  width: 100%;
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  font-size: var(--font-xs);
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
}

.account-flow-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.account-flow-item:nth-child(1) {
  align-items: flex-start;
  text-align: left;
}

.account-flow-item:nth-child(2) {
  align-items: flex-start;
  text-align: left;
}

.account-flow-item:nth-child(3) {
  align-items: flex-end;
  text-align: right;
}

.account-flow-amount {
  font-weight: var(--weight-normal);
  color: var(--text-primary);
  white-space: nowrap;
}

.account-flow-sep {
  color: var(--text-tertiary);
  text-align: center;
}

/* ===== TIMELINE ===== */
.timeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}

.timeline-tabs {
  display: flex;
  gap: var(--space-sm);
}

.timeline-tab {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
  cursor: pointer;
  color: var(--text-secondary);
  border: 0.5px solid transparent;
}
.timeline-tab.active {
  background: var(--primary-light);
  color: var(--primary);
}
.timeline-tab.disabled {
  color: var(--text-tertiary);
  cursor: default;
}

.timeline-group {
  position: relative;
  padding-left: 28px;
  margin-bottom: var(--space-lg);
}

.timeline-group::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 24px;
  bottom: -8px;
  width: 0.5px;
  background: var(--border);
}

.timeline-group:last-child::before { display: none; }

.timeline-date-dot {
  position: absolute;
  left: 3px;
  top: 4px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--primary);
}

.timeline-date {
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}

.timeline-item {
  background: var(--primary-pale);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  margin-bottom: var(--space-sm);
  cursor: pointer;
  border: 0.5px solid transparent;
}
.timeline-item:active { border-color: var(--primary); }
.timeline-item.done { opacity: 0.5; }

.timeline-item-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.timeline-item-title {
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
}

.timeline-item-amount {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
}

.timeline-item-status {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-top: 2px;
}

.employee-avatars {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.employee-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: var(--weight-semibold);
}

.loan-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-sm);
  margin-top: var(--space-sm);
  width: 100%;
}

.loan-metric {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  position: relative;
}

.loan-metric:not(:first-child)::before {
  content: '';
  position: absolute;
  left: calc(var(--space-sm) / -2);
  top: 2px;
  bottom: 2px;
  width: 0.5px;
  background: var(--border);
}

.loan-metric-label {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
}

.loan-metric-value {
  font-size: var(--font-xs);
  font-weight: var(--weight-normal);
  color: var(--text-secondary);
}

.loan-metric:nth-child(2) {
  align-items: center;
  text-align: center;
}

.loan-metric:last-child {
  align-items: flex-end;
  text-align: right;
}

.account-info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  margin-top: var(--space-sm);
  font-size: var(--font-xs);
  color: var(--text-secondary);
}

.account-bank {
  display: flex;
  align-items: center;
  gap: 6px;
}

.bank-icon {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--primary);
  flex-shrink: 0;
}

.bank-logo {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.account-name {
  color: var(--text-secondary);
  white-space: nowrap;
}

.timeline-item-actions {
  display: flex;
  gap: var(--space-sm);
  margin-top: var(--space-sm);
}

/* ===== SERVICE GRID ===== */
.service-recent {
  display: flex;
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
  overflow-x: auto;
  padding-bottom: var(--space-xs);
}
.service-recent::-webkit-scrollbar { display: none; }

.service-recent-item {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--border-light);
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  cursor: pointer;
  white-space: nowrap;
}
.service-recent-item:active { background: var(--primary-light); }

.service-recent-dot {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: var(--primary-light);
  border: 1px solid var(--primary);
  flex-shrink: 0;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
}

.service-grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--space-md) var(--space-xs);
  cursor: pointer;
  position: relative;
}
.service-grid-item:active { opacity: 0.7; }

.service-grid-icon {
  width: 28px;
  height: 28px;
  display: block;
  object-fit: contain;
}

.service-grid-label {
  font-size: var(--font-xs);
  color: var(--text-primary);
  font-weight: var(--weight-medium);
}

/* ===== CONTINGENCY CARD ===== */
.contingency-card {
}
.contingency-card.warning {
  border-color: var(--warning);
  border-left: 3px solid var(--warning);
}

.contingency-intro {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-lg);
  line-height: 1.5;
}

.scenario-item {
  margin-bottom: var(--space-md);
}

.scenario-bar-wrap {
  height: 6px;
  background: var(--border-light);
  border-radius: 3px;
  margin-bottom: var(--space-sm);
  overflow: hidden;
}

.scenario-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 400ms ease;
}
.scenario-bar.green { background: var(--success); }
.scenario-bar.blue  { background: var(--primary); }
.scenario-bar.orange { background: var(--warning); }

.scenario-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.scenario-balance {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
}

.scenario-action {
  font-size: var(--font-sm);
  color: var(--text-secondary);
}

.fund-record-state {
  background: var(--primary-pale);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
}

.fund-record-action-row {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-sm);
  margin-top: var(--space-xs);
}

.fund-record-action-row .btn {
  width: 100%;
}

/* ===== INSIGHT CARDS ===== */
.insight-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
}

.insight-title {
  font-size: var(--font-base);
  font-weight: var(--weight-semibold);
  margin-bottom: var(--space-sm);
}

.insight-desc {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-lg);
  line-height: 1.5;
}

.insight-source {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  width: 100%;
  border: none;
  border-top: 0.5px solid var(--border-light);
  background: transparent;
  padding: var(--space-md) 0 0;
  font-family: inherit;
  font-size: var(--font-xs);
  color: #999999;
  line-height: 1.45;
  margin-top: var(--space-md);
  text-align: left;
  cursor: pointer;
}

.insight-source-arrow {
  color: #999999;
  font-size: 14px;
  line-height: 1;
  flex-shrink: 0;
}

.mini-metrics {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-sm);
  margin-top: var(--space-md);
}

.mini-metric {
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
}

.action-card .mini-metric {
  background: #FFFFFF;
}

.action-card .mini-metrics + .action-buttons {
  margin-top: var(--space-md);
}

.insight-card .mini-metric {
  background: #F0F6FF;
}

.mini-metric-label {
  display: block;
  font-size: 12px;
  color: #333333;
  margin-bottom: 4px;
}

.mini-metric-value {
  display: block;
  font-size: var(--font-base);
  color: var(--primary);
  font-weight: var(--weight-semibold);
}

.mini-metric-note {
  display: block;
  font-size: 10px;
  color: #999999;
  margin-top: 2px;
}

/* ===== BUSINESS CHANGE ===== */
.business-change {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.change-card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.change-card,
.change-slide {
  height: 132px;
  border-radius: 14px;
  background: #FFFFFF;
  border: 0.5px solid #D8E8FF;
  padding: 14px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.change-card::after,
.change-slide::after {
  content: "";
  position: absolute;
  right: -18px;
  bottom: -22px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(187,171,255,0.18) 0%, rgba(22,119,255,0) 70%);
  pointer-events: none;
}

.change-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.change-card-title {
  font-size: 14px;
  font-weight: var(--weight-normal);
  color: #8A96AA;
}

.change-card-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: transparent;
  position: relative;
  flex-shrink: 0;
}

.change-card-icon::before,
.change-card-icon::after {
  content: "";
  position: absolute;
  background: #A8B2C6;
}

.change-card-icon::before {
  right: 0;
  top: 2px;
  width: 8px;
  height: 2px;
}

.change-card-icon::after {
  right: 0;
  top: 2px;
  width: 2px;
  height: 8px;
}

.change-metric-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.change-metric-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.change-metric-col:last-child {
  align-items: flex-end;
  text-align: right;
}

.change-badge {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: var(--weight-semibold);
}

.change-badge.in {
  background: #EAF2FF;
  color: var(--primary);
}

.change-badge.out {
  background: #FFF4D9;
  color: #B7791F;
}

.change-metric-value {
  font-size: 13px;
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  margin-top: 6px;
}

.change-metric-percent {
  font-size: 10px;
  font-weight: var(--weight-semibold);
  color: #EF4444;
  margin-top: 4px;
  margin-left: 0;
}

.change-badge.out + .change-metric-value + .change-metric-percent {
  color: #22C55E;
}

.change-card-note {
  font-size: 12px;
  line-height: 1.45;
  color: #6B7280;
  margin-top: auto;
  padding-bottom: 2px;
  position: relative;
  z-index: 1;
}

.change-slide .change-card-note {
  margin-top: 6px;
}

.change-carousel {
  position: relative;
  overflow: hidden;
}

.change-carousel-btn {
  position: absolute;
  inset: 0;
  z-index: 2;
  border: none;
  background: transparent;
  cursor: pointer;
}

.change-track {
  display: block;
  height: 132px;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  scroll-behavior: smooth;
}

.change-track::-webkit-scrollbar { display: none; }

.change-slide {
  height: 132px;
  scroll-snap-align: start;
  padding-right: 32px;
}

.change-slide .change-card-icon {
  position: absolute;
  right: 14px;
  top: 14px;
}

.change-slide-main {
  font-size: 14px;
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  margin-bottom: 0;
  line-height: 1.35;
}

.change-slide-value {
  font-size: 14px;
  color: var(--primary);
  font-weight: var(--weight-semibold);
  margin-left: 3px;
}

.change-slide-headline {
  display: flex;
  align-items: baseline;
  flex-wrap: nowrap;
  margin-top: 2px;
}

.change-slide .change-card-note {
  transform: translateY(2px);
}

.change-dots {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}

.change-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #D9E1F0;
}

.change-dot.active { background: #8293B5; }

/* Heat bar */
.heat-bar-row {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 60px;
  margin-bottom: var(--space-md);
}

.heat-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.heat-bar {
  width: 100%;
  max-width: 28px;
  background: var(--primary);
  opacity: 0.15;
  border-radius: 3px 3px 0 0;
  transition: height 400ms ease;
}

.heat-bar.high { opacity: 0.6; height: 48px; }
.heat-bar.mid  { opacity: 0.35; height: 24px; }
.heat-bar.low  { opacity: 0.1; height: 8px; }

.heat-bar-label {
  font-size: 10px;
  color: var(--text-tertiary);
}

/* Stacked bar */
.stack-bar-wrap {
  height: 8px;
  background: var(--border-light);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  margin-bottom: var(--space-sm);
}

.stack-seg {
  height: 100%;
}
.stack-seg.green  { background: var(--primary); }
.stack-seg.yellow { background: var(--primary); opacity: 0.5; }
.stack-seg.orange { background: var(--primary); opacity: 0.25; }

.stack-legend {
  display: flex;
  gap: var(--space-lg);
  font-size: var(--font-xs);
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
}

.stack-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.stack-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
}
.stack-legend-dot.green  { background: var(--primary); }
.stack-legend-dot.yellow { background: var(--primary); opacity: 0.5; }
.stack-legend-dot.orange { background: var(--primary); opacity: 0.25; }

/* Mini calendar */
.mini-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  text-align: center;
  margin-bottom: var(--space-md);
}

.mini-cal-header {
  font-size: 10px;
  color: var(--text-tertiary);
  padding: 4px 0;
}

.mini-cal-day {
  font-size: var(--font-xs);
  padding: 4px 0;
  border-radius: 4px;
  color: var(--text-secondary);
}

.mini-cal-day.highlight {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: var(--weight-semibold);
}

.mini-cal-day.faded { color: var(--text-tertiary); }

/* Category bars */
.cat-bars {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.cat-bar-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.cat-bar-label {
  width: 32px;
  font-size: var(--font-xs);
  color: var(--text-secondary);
  flex-shrink: 0;
}

.cat-bar-track {
  flex: 1;
  height: 8px;
  background: var(--border-light);
  border-radius: 4px;
  overflow: hidden;
}

.cat-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 400ms ease;
}

.cat-bar-change {
  width: 48px;
  font-size: var(--font-xs);
  font-weight: var(--weight-semibold);
  text-align: right;
}
.cat-bar-change.up { color: var(--text-secondary); }
.cat-bar-change.down { color: var(--text-secondary); }
.cat-bar-change.flat { color: var(--text-tertiary); }

/* ===== REVIEW CARD ===== */
.review-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}

.review-metric {
  text-align: center;
  padding: var(--space-md) var(--space-xs);
  background: var(--border-light);
  border-radius: var(--radius-sm);
}

.review-metric-val {
  font-size: var(--font-lg);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

.review-metric-label {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

.review-pressure {
  margin-bottom: var(--space-md);
}

.review-pressure-label {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}

.review-pressure-compare {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--font-sm);
  margin-bottom: var(--space-sm);
}

.review-pressure-bar-wrap {
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: var(--space-xs);
  display: flex;
}

.review-pressure-bar {
  height: 100%;
  background: var(--success);
  transition: width 400ms ease;
}

.review-pressure-drop {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
  color: var(--success);
}

.review-headline {
  font-size: 18px;
  font-weight: var(--weight-semibold);
  color: var(--success);
  margin-bottom: var(--space-md);
}

.review-pressure-name {
  font-size: var(--font-sm);
  color: var(--text-secondary);
}

.review-pressure-num {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
}

.review-pressure-bar-remain {
  height: 100%;
  background: var(--border);
  border-radius: 0 4px 4px 0;
}

.review-streak {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md);
  background: var(--primary-pale);
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
  color: var(--primary);
  margin-bottom: var(--space-md);
}

.review-streak-badge {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 10px;
  font-weight: var(--weight-semibold);
  flex-shrink: 0;
}

.review-btn {
  width: 100%;
}

.insights-bg {
  margin: 0 calc(var(--space-lg) * -1);
  padding: 8px var(--space-lg) 0;
}

/* Section title (outside card) */
.section-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: var(--weight-semibold);
  padding: 0;
  color: var(--text-primary);
}

.section-title img {
  width: 18px;
  height: 18px;
  display: block;
}

.insights-bg .section-title {
  margin-bottom: var(--space-md);
}

/* Insight card button full-width */
.insight-btn {
  width: 100%;
  margin-top: var(--space-md);
}

.insight-chart-label {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-bottom: var(--space-sm);
}

/* Scenario layout */
.scenario-label-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-xs);
}

.scenario-icon {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.scenario-icon.green-icon { background: var(--success); }
.scenario-icon.blue-icon  { background: var(--primary); }
.scenario-icon.orange-icon { background: var(--warning); }

.scenario-label {
  font-size: var(--font-sm);
  font-weight: var(--weight-medium);
  color: var(--text-primary);
}

.scenario-amount {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-left: auto;
}

.scenario-action-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: var(--space-xs);
  margin-bottom: var(--space-md);
}

.scenario-desc {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
}

.warning-text { color: var(--warning); }
.primary-text { color: var(--primary); }
.success-text { color: var(--success); }
.danger-text  { color: var(--danger); }

/* Service recent label */
.service-recent-label {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-bottom: var(--space-sm);
}

/* ===== BOTTOM SHEET ===== */
.overlay {
  position: absolute;
  top: 107px;
  left: 19px;
  width: 375px;
  bottom: 64px;
  background: rgba(0,0,0,0.4);
  z-index: 240;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: absolute;
  bottom: 64px;
  left: 19px;
  transform: translateY(100%);
  width: 375px;
  max-height: 663px;
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  z-index: 250;
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet.show {
  transform: translateY(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.sheet-handle {
  display: none;
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-lg) var(--space-lg) var(--space-md);
  flex-shrink: 0;
}

.sheet-title {
  font-size: var(--font-xl);
  font-weight: var(--weight-semibold);
}

.sheet-close {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 24px;
}
.sheet-close:active { background: var(--border-light); }

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 0 var(--space-lg) var(--space-2xl);
}

.week-overview-content {
  padding-top: 2px;
}

.sheet-section {
  margin-bottom: var(--space-lg);
}

.sheet-section-title {
  font-size: var(--font-sm);
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  margin-bottom: var(--space-sm);
}

.sheet-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) 0;
  border-bottom: 0.5px solid var(--border-light);
}

.sheet-row:last-child { border-bottom: none; }

.sheet-row-label { font-size: var(--font-base); }
.sheet-row-value { font-size: var(--font-base); font-weight: var(--weight-semibold); }
.sheet-row-value.primary { color: var(--primary); }

.sheet-total {
  font-size: var(--font-base);
  font-weight: var(--weight-semibold);
  color: var(--primary);
  text-align: right;
  padding: var(--space-md) 0;
}

.sheet-note {
  background: var(--border-light);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  font-size: var(--font-sm);
  color: var(--text-secondary);
  margin-top: var(--space-md);
  line-height: 1.5;
}

.sheet-input {
  width: 100%;
  padding: var(--space-md);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--font-2xl);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  text-align: center;
  font-family: inherit;
  margin: var(--space-md) 0;
}
.sheet-input:focus { outline: none; border-color: var(--primary); }

.sheet-amount-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.sheet-amount-label {
  font-size: var(--font-base);
  color: var(--text-primary);
  font-weight: var(--weight-regular);
}

.sheet-amount-value {
  font-size: var(--font-2xl);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

.sheet-compliance {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin: var(--space-md) 0;
  line-height: 1.4;
}

.sheet-actions {
  display: flex;
  gap: var(--space-sm);
  padding: var(--space-lg) 0;
}

.sheet-actions .btn { flex: 1; height: 44px; }

.execution-steps {
  padding-bottom: var(--space-lg);
}

.execution-step {
  position: relative;
  padding-left: 28px;
  margin-bottom: calc(var(--space-lg) + 8px);
}

.execution-step::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 24px;
  bottom: -16px;
  width: 0.5px;
  background: var(--border);
}

.execution-step:last-child::before { display: none; }

.execution-dot {
  position: absolute;
  left: 3px;
  top: 4px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--primary);
}

.execution-step.running .execution-dot {
  border-color: transparent;
  border-top-color: var(--primary);
  animation: executionSpin 0.8s linear infinite;
}

.execution-step.done .execution-dot {
  background: var(--primary);
  border-color: var(--primary);
  animation: none;
}

.execution-step.done .execution-dot::after {
  content: '✓';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -52%);
  color: #fff;
  font-size: 9px;
  font-weight: var(--weight-bold);
}

@keyframes executionSpin {
  to { transform: rotate(360deg); }
}

.execution-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.execution-title-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.execution-title {
  font-size: var(--font-base);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

.execution-desc {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  line-height: 1.5;
}

.execution-preview {
  width: 100%;
  height: 48px;
  margin-top: var(--space-lg);
}

.execution-preview.loading {
  background: var(--border);
  color: var(--text-tertiary);
  border: none;
  box-shadow: none;
}

.purchase-done-content {
  padding: var(--space-2xl) 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
}

.purchase-done-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: var(--weight-bold);
}

.purchase-done-text {
  text-align: center;
  font-size: var(--font-2xl);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}

/* Toast (centered within the phone column, not the viewport) */
.toast {
  position: fixed;
  top: 60px;
  left: calc(max(0px, (100vw - 1100px) / 2) + 375px / 2);
  transform: translateX(-50%) translateY(-100px);
  background: var(--text-primary);
  color: white;
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: var(--font-sm);
  z-index: 300;
  transition: transform 250ms ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== INTRO STORY PAGE ===== */
body.intro-on { overflow: hidden; }

.intro-page {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 48px;
  text-align: center;
}
.intro-inner {
  width: 100%;
  max-width: min(1960px, calc(100vw - 48px));
  display: flex;
  flex-direction: column;
  align-items: center;
}
.intro-visual-wrap {
  width: min(1960px, 100%);
  height: min(82vh, 1240px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.intro-visual {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.intro-controls {
  margin-top: -22px;
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}
.intro-arrow {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  background: #FFFFFF;
  color: var(--primary);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
}
.intro-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}
.intro-dots {
  display: flex;
  align-items: center;
  gap: 8px;
}
.intro-dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: #D8E8FF;
}
.intro-dot.active {
  width: 18px;
  background: var(--primary);
}
.intro-btn-wrap {
  margin-top: 8px;
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.intro-btn {
  display: inline-block;
  padding: 18px 52px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.intro-btn[hidden] { display: none; }
.intro-btn:active { opacity: 0.85; }

/* ===== STAGE: phone (left) + guide (right), centered as a block ===== */
.stage {
  display: grid;
  grid-template-columns: 413px 180px 413px;
  align-items: start;
  width: 1086px;
  flex: 0 0 1086px;
  margin: 0;
  min-height: 0;
  column-gap: 40px;
}
.stage-phone,
.legacy-phone {
  position: relative;
  top: auto;
  width: 413px;
  height: 1000px;
  overflow: visible;
  border-radius: 0;
}

.prototype-title {
  position: absolute;
  left: 19px;
  top: -8px;
  width: 375px;
  text-align: center;
  font-size: 32px;
  line-height: 40px;
  font-weight: var(--weight-semibold);
  color: #333333;
}

.legacy-phone {
  height: 1000px;
}
/* the phone scrolls inside its sticky viewport */
.stage-phone .phone-frame {
  position: absolute;
  left: 19px;
  top: 107px;
  height: 829px;
  overflow-y: auto;
  overflow-x: hidden;
}

.phone-shell {
  position: absolute;
  left: 0;
  top: 52px;
  width: 413px;
  height: 884px;
  z-index: 260;
  pointer-events: none;
  object-fit: contain;
}

.legacy-screen {
  position: absolute;
  left: 19px;
  top: 107px;
  width: 375px;
  height: 829px;
  background: #F0F6FF;
  overflow: hidden;
  padding: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.legacy-shot {
  display: block;
  width: 100%;
  height: auto;
  flex-shrink: 0;
}

.legacy-page {
  min-height: 100%;
  background: #FFFFFF;
  border-radius: var(--radius);
  padding: 16px;
}

.legacy-page-title {
  font-size: 18px;
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  margin-bottom: 14px;
}

.legacy-page-sub {
  font-size: 12px;
  color: #999999;
  margin-bottom: 14px;
}

.legacy-list {
  display: grid;
  gap: 10px;
}

.legacy-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: #F7FAFF;
  border-radius: 8px;
}

.legacy-row-main {
  font-size: 13px;
  color: #333333;
}

.legacy-row-sub {
  display: block;
  font-size: 11px;
  color: #999999;
  margin-top: 3px;
}

.legacy-row-amount {
  font-size: 13px;
  font-weight: var(--weight-semibold);
  color: var(--primary);
}

.legacy-placeholder-note {
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  background: #F5F6FA;
  font-size: 12px;
  line-height: 1.5;
  color: #666666;
}

.compare-rail {
  position: sticky;
  top: 122px;
  height: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.compare-node {
  width: 108px;
  border: 0.5px solid #FFD8A8;
  background: #FFFFFF;
  border-radius: 999px;
  padding: 9px 8px;
  font-family: inherit;
  font-size: 14px;
  color: #666666;
  cursor: pointer;
  transition: all var(--transition);
}

.compare-node.active {
  background: #FF8A00;
  color: #FFFFFF;
  border-color: #FF8A00;
  font-weight: var(--weight-semibold);
}

.compare-line {
  width: 1px;
  height: 14px;
  background: #FFD8A8;
}

.compare-callout {
  position: absolute;
  left: -10px;
  width: 433px;
  border: 2px solid #FF8A00;
  border-radius: 16px;
  box-shadow: 0 0 0 5px rgba(255, 138, 0, 0.14);
  pointer-events: none;
  z-index: 520;
  opacity: 0;
  transform: translateY(0);
  transition: opacity var(--transition), top 220ms ease, height 220ms ease;
}

.compare-callout.show {
  opacity: 1;
}

.guide-header { display: none; }
.guide-title {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 14px;
  letter-spacing: 0.01em;
}

/* ===== 背景分析区（标题下方、tab 上方） ===== */
.bg-section {
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
}
.bg-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.bg-kicker {
  font-size: 18px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 0;
}
.bg-heading {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.45;
  margin-bottom: 0;
}
.bg-lead,
.bg-note {
  font-size: 14px;
  line-height: 1.7;
  color: #666666;
  margin-bottom: 16px;
}
.bg-lead strong,
.bg-note strong { color: var(--text-primary); font-weight: 600; }

.bg-visual-slot {
  margin: 18px 0 26px;
  padding: 18px;
  min-height: 140px;
  border: 1px dashed #C9D8F2;
  border-radius: 10px;
  background: #F8FBFF;
  color: #8A96AA;
}
.bg-visual-title {
  font-size: 13px;
  font-weight: 600;
  color: #4B6FAE;
  margin-bottom: 6px;
}
.bg-visual-desc {
  font-size: 12px;
  line-height: 1.6;
}

.bg-section-block {
  margin-top: 26px;
}
.bg-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.bg-load-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 0 26px;
}
.bg-load-row {
  padding: 14px 12px;
  background: #F7FAFF;
  border: 0.5px solid #E2ECFF;
  border-radius: 8px;
}
.bg-load-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.bg-load-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: #E9F1FF;
  position: relative;
  flex-shrink: 0;
}
.bg-load-icon.search::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 6px;
  width: 8px;
  height: 8px;
  border: 2px solid var(--primary);
  border-radius: 50%;
}
.bg-load-icon.search::after {
  content: "";
  position: absolute;
  left: 15px;
  top: 16px;
  width: 7px;
  height: 2px;
  border-radius: 2px;
  background: var(--primary);
  transform: rotate(45deg);
}
.bg-load-icon.memory::before,

function getCopyValue(path) {
  return path.split('.').reduce((value, key) => value && value[key], COMMON_COPY);
}

function applyCommonCopy() {
  document.querySelectorAll('[data-copy]').forEach(element => {
    const value = getCopyValue(element.dataset.copy);
    if (value !== undefined) element.textContent = value;
  });
  document.querySelectorAll('[data-copy-aria]').forEach(element => {
    const value = getCopyValue(element.dataset.copyAria);
    if (value !== undefined) element.setAttribute('aria-label', value);
  });
  document.querySelectorAll('[data-copy-value]').forEach(element => {
    const value = getCopyValue(element.dataset.copyValue);
    if (value !== undefined) element.value = value;
  });
}

let weekSummaryTimers = [];

function renderWeekSummary(animate) {
  const summaryText = document.getElementById('weekSummaryText');
  if (!summaryText) return;
  weekSummaryTimers.forEach(timer => clearTimeout(timer));
  weekSummaryTimers = [];
  const text = summaryText.dataset.text || '';
  if (!animate) {
    summaryText.textContent = text;
    return;
  }
  let index = 0;
  summaryText.innerHTML = '<span class="week-summary-cursor"></span>';

  function tick() {
    const visible = text.slice(0, index);
    const cursor = index < text.length ? '<span class="week-summary-cursor"></span>' : '';
    summaryText.innerHTML = visible + cursor;
    if (index < text.length) {
      index += 1;
      weekSummaryTimers.push(setTimeout(tick, 38));
    }
  }

  weekSummaryTimers.push(setTimeout(tick, 180));
}

function renderRows(rows) {
  return rows.map(row => '<div class="sheet-row"><span class="sheet-row-label">' + row[0] + '</span><span class="sheet-row-value">' + row[1] + '</span></div>').join('');
}

function setEvidence(sheetId, rows, note) {
  const sheet = document.getElementById('sheet-' + sheetId);
  if (!sheet) return;
  const section = sheet.querySelector('.sheet-section');
  const noteEl = sheet.querySelector('.sheet-note');
  if (section) section.innerHTML = renderRows(rows);
  if (noteEl) noteEl.textContent = note;
}

function applyMerchantRole(role) {
  const content = ROLE_CONTENT[role] || ROLE_CONTENT.supplier;
  const summaryText = document.getElementById('weekSummaryText');
  if (summaryText) {
    summaryText.dataset.text = content.summary;
    renderWeekSummary(!document.body.classList.contains('intro-on'));
  }

  const inTotal = document.querySelector('.flow-col.in .flow-col-total');
  const outTotal = document.querySelector('.flow-col.out .flow-col-total');
  const poolAmount = document.querySelector('.flow-pool-amt');
  if (inTotal) inTotal.textContent = content.flow.inTotal;
  if (outTotal) outTotal.textContent = content.flow.outTotal;
  if (poolAmount) poolAmount.textContent = content.flow.pool;

  document.querySelectorAll('.flow-col.in .flow-card').forEach((card, index) => {
    const item = content.flow.inItems[index];
    if (!item) return;
    card.querySelector('.fc-name').textContent = item[0];
    card.querySelector('.fc-amt').textContent = item[1];
  });
  document.querySelectorAll('.flow-col.out .flow-card').forEach((card, index) => {
    const item = content.flow.outItems[index];
    if (!item) {
      card.style.display = 'none';
      return;
    }
    card.style.display = '';
    card.querySelector('.fc-name').textContent = item[0];
    card.querySelector('.fc-amt').textContent = item[1];
  });

  document.querySelectorAll('.bc-point-label').forEach((label, index) => {
    label.textContent = content.flow.balanceLabels[index] || '';
  });

  const actions = document.querySelector('[data-step="step-2"]');
  const weekOverview = document.getElementById('weekOverviewContent');
  const insights = document.querySelector('[data-step="step-4"]');
  if (actions) actions.innerHTML = content.actions;
  if (weekOverview) weekOverview.innerHTML = content.timeline;
  if (insights) insights.innerHTML = content.insights;

  setEvidence('evidencePrice', content.evidence.price, content.evidence.priceNote);
  setEvidence('evidenceHoliday', content.evidence.holiday, content.evidence.holidayNote);
  setEvidence('evidenceLabor', content.evidence.labor, content.evidence.laborNote);

  document.querySelectorAll('.role-option').forEach(button => {
    button.classList.toggle('active', button.dataset.role === role);
  });
}

applyCommonCopy();
applyMerchantRole('supplier');

document.addEventListener('click', event => {
  const button = event.target.closest('.role-option');
  if (!button) return;
  applyMerchantRole(button.dataset.role);
});

// ===== INTRO → ENTER (no fade, click to enter) =====
(function() {
  const introBtn = document.getElementById('introEnterBtn');
  const introPage = document.getElementById('introPage');
  const introVisual = document.getElementById('introVisual');
  const prevBtn = document.getElementById('introPrevBtn');
  const nextBtn = document.getElementById('introNextBtn');
  const dots = Array.from(document.querySelectorAll('.intro-dot'));
  const slides = ['intro-shots/no1.png', 'intro-shots/no2.png', 'intro-shots/no3.png', 'intro-shots/no4.png'];
  let index = 0;

  if (!introBtn || !introPage) return;

  function renderIntroSlide() {
    if (introVisual) introVisual.src = slides[index];
    if (prevBtn) prevBtn.disabled = index === 0;
    if (nextBtn) nextBtn.disabled = index === slides.length - 1;
    dots.forEach((dot, dotIndex) => dot.classList.toggle('active', dotIndex === index));
    introBtn.hidden = index !== slides.length - 1;
  }

  if (prevBtn) {
    prevBtn.addEventListener('click', function() {
      index = Math.max(0, index - 1);
      renderIntroSlide();
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', function() {
      index = Math.min(slides.length - 1, index + 1);
      renderIntroSlide();
    });
  }

  document.addEventListener('keydown', function(event) {
    if (introPage.style.display === 'none') return;
    if (event.key === 'ArrowLeft') {
      index = Math.max(0, index - 1);
      renderIntroSlide();
    }
    if (event.key === 'ArrowRight') {
      index = Math.min(slides.length - 1, index + 1);
      renderIntroSlide();
    }
  });

  introBtn.addEventListener('click', function() {
    introPage.style.display = 'none';
    document.body.classList.remove('intro-on');
    document.body.scrollTop = 0;
    renderWeekSummary(true);
  });

  renderIntroSlide();
})();

  const guideSteps = document.getElementById('guideSteps');
  const guidePanel = document.getElementById('guidePanel');
  if (!guideSteps || !guidePanel) return;
  const steps = Array.from(guideSteps.querySelectorAll('.guide-step'));
  const phone = document.querySelector('.phone-frame');

  // commentary for each step
  const COPY = {
    'step-1': {
      title: '第一步：先把全局讲清楚',
      points: [
        '进入页面先看到本周资金判断，减少翻账户和查明细。',
        '资金图把预计进账、现有资金、预计支出放在同一屏。',
        '余额图标出最低点，让用户知道哪一天最需要留意。'
      ]
    },
    'step-2': {
      title: '第二步：把今天该处理的事挑出来',
      points: [
        '只展示会影响后续安排的事项，降低当天决策压力。',
        '每张卡保留金额、对象、时间、账户这些关键信息。',
        '客户回款加入历史习惯，帮助用户判断先联系谁。'
      ]
    },
    'step-4': {
      title: '第三步：看见更早一点的变化',
      points: [
        '用交易记录识别进货、工资、回款和缴费里的规律。',
        '结合公开行业数据，给出备货、现金留存和用工提醒。',
        '每条建议都提供来源，用户可以查看判断依据。'
      ]
    },
    'step-value': {
      title: '这个方案的价值',
      rows: [
        { label: '用户', text: '减少查找、记忆和理解成本。资金状态、关键事项和可执行动作放在一起，处理经营资金更快。' },
        { label: '银行', text: '转账、理财、代发、缴费、贷款进入真实经营场景。服务触发来自用户当下的资金任务。' },
        { label: '产品', text: '页面回答三个问题：<strong>现在发生了什么，今天要处理什么，下一步可以提前看什么</strong>。' }
      ]
    }
  };

  function render(step) {
    const c = COPY[step];
    if (!c) return;
    if (c.rows) {
      // value / thinking view
      guidePanel.innerHTML =
        '<div class="gp-title">' + c.title + '</div>' +
        c.rows.map(function(r) {
          return '<div class="gp-value-row"><div class="gp-value-label">' + r.label +
                 '</div><div class="gp-value-text">' + r.text + '</div></div>';
        }).join('');
    } else if (c.points) {
      // 要点列表（无图的 tab）
      guidePanel.innerHTML =
        '<div class="gp-title">' + c.title + '</div>' +
        '<ul class="gp-points">' +
        c.points.map(function(p) { return '<li>' + p + '</li>'; }).join('') +
        '</ul>';
    } else {
      // step commentary view
      guidePanel.innerHTML =
        '<div class="gp-title">' + c.title + '</div>' +
        '<div class="gp-text">' + c.role + '</div>' +
        '<div class="gp-text">' + c.design + '</div>';
    }
    // re-trigger fade animation
    guidePanel.style.animation = 'none';
    void guidePanel.offsetWidth;
    guidePanel.style.animation = '';
  }

  function setActive(step, scrollPhone) {
    steps.forEach(s => s.classList.toggle('active', s.dataset.jump === step));
    render(step);
    if (scrollPhone && step.indexOf('value') === -1) {
      const target = document.querySelector('[data-step="' + step + '"]');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // click a step → scroll phone + switch commentary (value tab doesn't scroll phone)
  steps.forEach(s => {
    s.addEventListener('click', function() {
      setActive(s.dataset.jump, s.dataset.jump.indexOf('value') === -1);
    });
  });

  // scroll phone → update active step (phone scrolls inside .phone-frame)
  if ('IntersectionObserver' in window && phone) {
    const anchors = Array.from(document.querySelectorAll('[data-step]'));
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const step = entry.target.dataset.step;
          steps.forEach(s => s.classList.toggle('active', s.dataset.jump === step));
          render(step);
        }
      });
    }, { root: phone, rootMargin: '-90px 0px -55% 0px', threshold: 0 });
    anchors.forEach(a => observer.observe(a));
  }

  // initial render
  setActive('step-1', false);
})();

// Sheet management
let activeSheet = null;
let executionTimer = null;

function openSheet(id) {
  if (activeSheet) closeSheet(false);
  const sheet = document.getElementById('sheet-' + id);
  const overlay = document.getElementById('overlay');
  if (!sheet) return;
  sheet.classList.add('show');
  overlay.classList.add('show');
  activeSheet = id;
  if (id === 'executionProcess') resetExecutionProcess();
  document.body.style.overflow = 'hidden';
}

function closeSheet(animate = true) {
  if (!activeSheet) return;
  if (activeSheet === 'executionProcess' && executionTimer) {
    clearTimeout(executionTimer);
    executionTimer = null;
  }
  const sheet = document.getElementById('sheet-' + activeSheet);
  const overlay = document.getElementById('overlay');
  if (sheet) sheet.classList.remove('show');
  overlay.classList.remove('show');
  activeSheet = null;
  document.body.style.overflow = '';
}

// Map view switching
function switchMapView(view, el) {
  document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const tabs = document.querySelector('.map-tabs');
  tabs.classList.remove('show-left', 'show-right');
  tabs.classList.add(view === 'flow' ? 'show-left' : 'show-right');
  document.getElementById('flowView').style.display = view === 'flow' ? 'block' : 'none';
  document.getElementById('balanceView').style.display = view === 'balance' ? 'block' : 'none';
}

// Mark action as done
function markDone(id, btn) {
  btn.textContent = COMMON_COPY.interactions.done;
  btn.disabled = true;
  btn.style.opacity = '0.5';
  updateActionProgress();
}

function updateActionProgress() {
  const total = document.querySelectorAll('.action-card').length;
  const done = document.querySelectorAll('.action-card.done').length;
  const indicator = document.querySelector('.content > div:nth-child(6) span:last-child');
  if (indicator) indicator.textContent = done + '/' + total;
}

function toggleCollections(btn) {
  const details = btn.closest('.collection-details');
  details.classList.toggle('expanded');
  btn.firstChild.textContent = details.classList.contains('expanded')
    ? COMMON_COPY.interactions.collapse
    : COMMON_COPY.interactions.expand;
}

const LEGACY_PAGES = {
  home: 'legacy-shots/shouye.png',
  receivable: 'legacy-shots/chahuikuan.png',
  payment: 'legacy-shots/yuefukuan.png',
  salary: 'legacy-shots/kangongzi.png',
  cash: 'legacy-shots/fangxianqian.png',
  analysis: 'legacy-shots/no.png',
  stockup: 'legacy-shots/no.png'
};

function renderLegacyPage(key) {
  const page = LEGACY_PAGES[key] || LEGACY_PAGES.home;
  const el = document.getElementById('legacyShot');
  if (!el) return;
  el.src = page;
}

function hideCompareCallout() {
  const callout = document.getElementById('compareCallout');
  if (callout) callout.classList.remove('show');
}

function positionCompareCallout(target) {
  const callout = document.getElementById('compareCallout');
  const stagePhone = document.querySelector('.stage-phone');
  if (!callout || !stagePhone || !target) return;

  const stageRect = stagePhone.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();
  callout.style.top = (targetRect.top - stageRect.top - 10) + 'px';
  callout.style.height = (targetRect.height + 20) + 'px';
  callout.classList.add('show');
}

function highlightFundMap(key) {
  hideCompareCallout();
  if (key !== 'salary') closeSheet(false);

  const phone = document.querySelector('.phone-frame');
  if (key === 'home') {
    if (phone) phone.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  let target = null;
  if (key === 'receivable') target = document.getElementById('action1');
  if (key === 'payment') target = document.getElementById('action2');
  if (key === 'cash') target = document.getElementById('action3');
  if (key === 'analysis') target = document.getElementById('businessChange');
  if (key === 'stockup') target = document.getElementById('insightPrice');

  if (key === 'salary') {
    openSheet('weekOverview');
    return;
  }

  if (target && phone) {
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    window.setTimeout(() => positionCompareCallout(target), 260);
  }
}

document.querySelectorAll('.compare-node').forEach(node => {
  node.addEventListener('click', () => {
    const key = node.dataset.compare;
    document.querySelectorAll('.compare-node').forEach(item => item.classList.toggle('active', item === node));
    renderLegacyPage(key);
    highlightFundMap(key);
  });
});

function updateChangeDots(carousel, index) {
  carousel.querySelectorAll('.change-dot').forEach((dot, dotIndex) => {
    dot.classList.toggle('active', dotIndex === index);
  });
}

function nextChangeSlide(button) {
  const carousel = button.closest('.change-carousel');
  const track = carousel && carousel.querySelector('.change-track');
  if (!track) return;
  const total = track.children.length;
  const height = track.clientHeight;
  const current = Math.round(track.scrollTop / height);
  const next = (current + 1) % total;
  track.scrollTo({ top: next * height, behavior: 'smooth' });
  updateChangeDots(carousel, next);
}

document.querySelectorAll('.change-carousel').forEach(carousel => {
  const track = carousel.querySelector('.change-track');
  if (!track) return;
  track.addEventListener('scroll', () => {
    const height = track.clientHeight || 1;
    const index = Math.round(track.scrollTop / height);
    updateChangeDots(carousel, index);
  }, { passive: true });
});

// Execution process
function resetExecutionProcess() {
  const sheet = document.getElementById('sheet-executionProcess');
  if (!sheet) return;
  sheet.querySelector('.sheet-title').textContent = COMMON_COPY.execution.activeTitle;
  sheet.querySelectorAll('.execution-step').forEach(step => step.classList.remove('running', 'done'));
  const btn = document.getElementById('executionBtn');
  btn.textContent = COMMON_COPY.execution.idleButton;
  btn.disabled = false;
  btn.classList.remove('loading');
  btn.onclick = startExecutionProcess;
  if (executionTimer) {
    clearTimeout(executionTimer);
    executionTimer = null;
  }
}

function startExecutionProcess() {
  const sheet = document.getElementById('sheet-executionProcess');
  const steps = Array.from(sheet.querySelectorAll('.execution-step'));
  const btn = document.getElementById('executionBtn');
  let index = 0;

  btn.textContent = COMMON_COPY.execution.runningButton;
  btn.disabled = true;
  btn.classList.add('loading');
  steps.forEach(step => step.classList.remove('running', 'done'));

  function runNext() {
    if (index > 0) steps[index - 1].classList.add('done');
    if (index >= steps.length) {
      executionTimer = null;
      openSheet('purchaseDone');
      return;
    }
    steps[index].classList.add('running');
    executionTimer = setTimeout(() => {
      steps[index].classList.remove('running');
      index += 1;
      runNext();
    }, 700);
  }

  runNext();
}

// Toast
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

// Close sheet on ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
});
</script>
